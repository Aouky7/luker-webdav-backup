name: Plugin checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check backend syntax
        run: |
          node --check index.mjs
          node --check webdav.mjs
      - name: Check browser module syntax
        run: node --input-type=module --check < frontend.js
      - name: Run offline regression tests
        run: node --test tests/*.test.mjs
