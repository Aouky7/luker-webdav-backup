name: Plugin checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install development dependencies
        run: npm ci --ignore-scripts
      - name: Check syntax
        run: npm run check
      - name: Run offline regression tests
        run: npm test
      - name: Check real HTTPS request behavior
        run: npm run test:network

  webdav-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-webdav.txt
      - name: Install independent server test dependencies
        run: python -m pip install -r tests/requirements-webdav.txt
      - name: Test WsgiDAV over HTTPS with synthetic archives
        run: node tests/run-network.mjs --wsgidav
